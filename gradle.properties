# Project-wide Gradle settings for Privacy Period.

# Memory and encoding for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build performance.
org.gradle.caching=true
org.gradle.parallel=true

# Use the official Kotlin code style (aligned with ktlint).
kotlin.code.style=official

# Only build the native targets the host can produce (e.g. skip iOS on Linux CI)
# instead of failing the configuration phase.
kotlin.native.ignoreDisabledTargets=true
