name: iOS CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Shared module — lint, static analysis, and tests
        run: ./gradlew :shared:jvmTest ktlintCheck detekt --stacktrace

      - name: Install iOS tooling
        run: brew install xcodegen swiftlint

      - name: SwiftLint
        working-directory: iosApp
        run: swiftlint lint --strict

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Build iOS app
        working-directory: iosApp
        run: |
          xcodebuild build \
            -project PrivacyPeriod.xcodeproj \
            -scheme PrivacyPeriod \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
