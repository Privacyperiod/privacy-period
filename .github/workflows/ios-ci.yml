name: iOS CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install iOS tooling
        run: brew install xcodegen swiftlint cocoapods

      - name: Shared module — lint, static analysis, and tests (incl. encrypted DB on iOS)
        run: ./gradlew :shared:jvmTest :shared:iosSimulatorArm64Test ktlintCheck detekt --stacktrace

      - name: SwiftLint
        working-directory: iosApp
        run: swiftlint lint --strict

      # Run from the repository root: the shared module is part of the root
      # Gradle build, so invoking the wrapper from iosApp/ would make Gradle
      # treat iosApp as the project directory and fail.
      - name: Generate shared CocoaPods artifacts
        run: ./gradlew :shared:podspec :shared:generateDummyFramework

      - name: Generate Xcode project and install pods
        working-directory: iosApp
        run: |
          xcodegen generate
          pod install

      - name: Build iOS app
        working-directory: iosApp
        run: |
          xcodebuild build \
            -workspace PrivacyPeriod.xcworkspace \
            -scheme PrivacyPeriod \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
