# XcodeGen spec for the Privacy Period iOS app.
#
# The .xcodeproj is generated from this file (and is git-ignored). Regenerate
# with `xcodegen generate` from the iosApp/ directory after changing this spec.

name: PrivacyPeriod

options:
  bundleIdPrefix: org.privacyperiod
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

# Three build configurations:
#   Debug   — local development (DEMO on: all clinical modules visible for testing)
#   Demo    — release-optimised build for TestFlight / clinician review (DEMO on)
#   Release — App Store build (DEMO off: clinical modules stay gated until sign-off)
configs:
  Debug: debug
  Demo: release
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    # The build runs a Gradle script phase to compile the Kotlin framework, which
    # must write outside the per-script sandbox.
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CODE_SIGN_STYLE: Automatic
    # Apple Developer Team ID for device / TestFlight signing, injected from the
    # PRIVACYPERIOD_TEAM environment variable at generate time so it stays out of the
    # public repo. Unset (CI, fresh clones) → empty, which is fine for simulator builds.
    # Set it once in your shell: export PRIVACYPERIOD_TEAM=XXXXXXXXXX (see TESTING.md).
    DEVELOPMENT_TEAM: ${PRIVACYPERIOD_TEAM}

targets:
  PrivacyPeriod:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: PrivacyPeriod
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.privacyperiod.ios
        PRODUCT_NAME: PrivacyPeriod
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "2"
        # Emit localized-string keys so the String Catalog stays the single
        # source of truth for user-facing text.
        SWIFT_EMIT_LOC_STRINGS: "YES"
        # The shared Kotlin framework and SQLCipher are supplied by CocoaPods
        # (see iosApp/Podfile). The shared pod's own script phase builds the
        # framework via Gradle, so no manual embed step is needed here.
      configs:
        # DEMO reveals the gated clinical modules (see ClinicalGate.swift). On for
        # local dev and the TestFlight Demo build; off for the App Store Release.
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG DEMO
        Demo:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEMO
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: PrivacyPeriod AppStore
    info:
      path: PrivacyPeriod/Info.plist
      properties:
        CFBundleDisplayName: Privacy Period
        # Single-source the version from the build settings above, so bumping
        # MARKETING_VERSION / CURRENT_PROJECT_VERSION is the only place to change it.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The only encryption is SQLCipher protecting the user's own data at rest
        # (standard AES) — exempt from export self-classification. Declaring it here
        # stops App Store Connect prompting on every TestFlight upload. Confirm this
        # declaration still holds before any public App Store release.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Bundled Desert Dusk fonts (converted from the design system woff2).
        UIAppFonts:
          - InstrumentSerif-Regular.ttf
          - InstrumentSerif-Italic.ttf
          - Outfit-Regular.ttf
          - Outfit-Medium.ttf
          - Outfit-SemiBold.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
          - IBMPlexMono-SemiBold.ttf

schemes:
  PrivacyPeriod:
    build:
      targets:
        PrivacyPeriod: all
    run:
      config: Debug
    archive:
      config: Release
  PrivacyPeriod (Demo):
    build:
      targets:
        PrivacyPeriod: all
    run:
      config: Demo
    archive:
      config: Demo
