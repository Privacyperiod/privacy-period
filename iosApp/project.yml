# XcodeGen spec for the Privacy Period iOS app.
#
# The .xcodeproj is generated from this file (and is git-ignored). Regenerate
# with `xcodegen generate` from the iosApp/ directory after changing this spec.

name: PrivacyPeriod

options:
  bundleIdPrefix: org.privacyperiod
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    # The build runs a Gradle script phase to compile the Kotlin framework, which
    # must write outside the per-script sandbox.
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CODE_SIGN_STYLE: Automatic

targets:
  PrivacyPeriod:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: PrivacyPeriod
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.privacyperiod.app
        PRODUCT_NAME: PrivacyPeriod
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Privacy Period
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        # Emit localized-string keys so the String Catalog stays the single
        # source of truth for user-facing text.
        SWIFT_EMIT_LOC_STRINGS: "YES"
        # The Kotlin framework is produced by the Gradle script phase below into
        # this per-configuration / per-SDK directory.
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          set -e
          cd "$SRCROOT/.."
          if [ -z "$JAVA_HOME" ]; then
            if /usr/libexec/java_home >/dev/null 2>&1; then
              export JAVA_HOME="$(/usr/libexec/java_home)"
            elif [ -d "/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home" ]; then
              export JAVA_HOME="/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home"
            fi
          fi
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode

schemes:
  PrivacyPeriod:
    build:
      targets:
        PrivacyPeriod: all
    run:
      config: Debug
